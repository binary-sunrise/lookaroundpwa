<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BioCollect PWA Download</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #1A1B1E;
      color: #C1C2C5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #25262B;
      border: 1px solid #373A40;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #373A40;
      border-top-color: #E13535;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    .check {
      display: none;
      width: 50px;
      height: 50px;
      background: #2F9E44;
      border-radius: 50%;
      color: white;
      font-size: 30px;
      line-height: 50px;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      margin: 0 0 8px;
      color: #FFFFFF;
      font-size: 20px;
    }
    p {
      margin: 0 0 16px;
      font-size: 14px;
      color: #909296;
    }
    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #373A40;
      border-radius: 4px;
      overflow: hidden;
      margin: 16px 0;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #E13535, #FA5252);
      transition: width 0.3s ease;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(225, 53, 53, 0.15);
      color: #FA5252;
    }
    .confirm-btn {
      display: none;
      margin: 18px auto 0;
      padding: 11px 24px;
      background: #E13535;
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(225, 53, 53, 0.3);
    }
    .confirm-btn:hover {
      background: #c92a2a;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="spinner" class="spinner"></div>
    <div id="check" class="check">✓</div>
    <h2 id="title">Downloading Survey Package</h2>
    <p id="desc">Caching survey schema, form templates, and local species taxonomy lists...</p>
    <div class="progress-bar-container">
      <div id="progress" class="progress-bar"></div>
    </div>
    <span id="badge" class="badge">In Progress</span>
    <div>
      <button type="button" id="confirmBtn" class="confirm-btn">Finish & Confirm Download</button>
    </div>
  </div>

  <script>
    (function() {
      const progressBar = document.getElementById('progress');
      const spinner = document.getElementById('spinner');
      const check = document.getElementById('check');
      const title = document.getElementById('title');
      const desc = document.getElementById('desc');
      const badge = document.getElementById('badge');
      const confirmBtn = document.getElementById('confirmBtn');

      confirmBtn.addEventListener('click', function() {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ event: 'confirm-download' }, '*');
        }
      });

      let pct = 0;
      const interval = setInterval(() => {
        pct += 25;
        if (pct > 100) pct = 100;
        progressBar.style.width = pct + '%';

        if (pct >= 100) {
          clearInterval(interval);
          spinner.style.display = 'none';
          check.style.display = 'block';
          title.textContent = 'Survey Downloaded!';
          desc.textContent = 'Survey forms and species assets are cached and ready for offline field work.';
          badge.textContent = 'Ready to Confirm';
          badge.style.background = 'rgba(47, 158, 68, 0.2)';
          badge.style.color = '#51CF66';
          confirmBtn.style.display = 'inline-block';

          // Notify parent modal that download is complete so Confirm button activates
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ event: 'download-complete' }, '*');
          }
        }
      }, 200);
    })();
  </script>
</body>
</html>
